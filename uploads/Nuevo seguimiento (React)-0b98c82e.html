<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo seguimiento — modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root { font-family: 'Geist', system-ui, sans-serif; }
  body { margin: 0; background: #FCFCFC; }
  * { letter-spacing: -0.01em; }
  .material-symbols-outlined { font-variation-settings: 'opsz' 24, 'wght' 400, 'FILL' 0, 'GRAD' 0; }
  /* tidy scrollbar inside the modal */
  .ns-scroll::-webkit-scrollbar { width: 10px; }
  .ns-scroll::-webkit-scrollbar-thumb { background: #D9D9D9; border-radius: 99px; border: 3px solid #fff; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback } = React;

/* ────────────────────────────────────────────────────────────────
   Mock data — one hardcoded patient simulates the API response.
   ──────────────────────────────────────────────────────────────── */
const PATIENTS = [
  { dni: "1234",      name: "Lucía Ramírez Soto" },
  { dni: "1235",      name: "Carlos Andrés Gómez" },
  { dni: "1236",      name: "Valentina Ríos Mejía" },
  { dni: "123456",    name: "Jorge Esteban Niño" },
  { dni: "123456789", name: "Pedro Pepito Pérez" },
];

const MOCK_PATIENT = {
  name: "Pedro Pepito Pérez",
  documento: "123 456 789",
  edad: "34 años",
  sangre: "Sin registrar",
  telefono: "+58 414 123 45 89",
  nps: "8/10 – Paciente satisfecho con el seguimiento; solicita recordatorios de medicación por WhatsApp y ajuste de horarios de control.",
  nacimiento: "12 sept. 1991",
  genero: "Masculino",
  ultimaConsulta: "03 jun. 2026",
  correo: "pedro.perez@gmail.com",
  alergias: "No registra alergias",
  contactoNombre: "María Ortega",
  contactoTel: "+58 414 123 25 67",
  direccion: "Calle 49 #56-36. Barquisimeto, Lara, Venezuela.",
};

const FOLLOWUPS = [
  { n: 1, freq: "Horas", value: 36, questions: [
    "¿Pudo iniciar el tratamiento indicado?",
    "¿Ha sentido alguna reacción adversa o molestia nueva tras haber iniciado el tratamiento indicado?",
    "¿Qué intensidad tiene su molestia o síntoma principal el día de hoy?",
    "¿Tiene alguna duda sobre las indicaciones?",
  ]},
  { n: 2, freq: "Días", value: 4, questions: [
    "¿Ha continuado con su tratamiento exactamente como se indicó?",
    "Comparado con el primer día, ¿cómo describiría la evolución de su síntoma principal hoy?",
    "¿Ha aparecido algún síntoma NUEVO que no tenía el día de la consulta?",
  ]},
  { n: 3, freq: "Días", value: 8, cierre: true, questions: [
    "¿Logró terminar todo el esquema de tratamiento por los días indicados?",
    "En términos generales, ¿considera que el problema por el que consultó ya se resolvió?",
    "Según cómo se siente, ¿necesita agendar una nueva consulta de control con su médico?",
  ]},
];

const initials = (n) => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("");

/* ────────────────────────────────────────────────────────────────
   Small presentational helpers
   ──────────────────────────────────────────────────────────────── */
function Field({ label, value }) {
  return (
    <div className="flex flex-col gap-0.5">
      <span className="text-[13px] text-[#626262]">{label}</span>
      <span className="text-[14px] font-medium text-[#0B0B0B]">{value}</span>
    </div>
  );
}

function PatientCard({ p, onUnlink }) {
  return (
    <div className="flex flex-col gap-4">
      {/* success banner */}
      <div className="flex items-start gap-3 rounded-[12px] border border-[#A6E0CC] bg-[#EDFAF4] p-4">
        <span className="material-symbols-outlined text-[#0A7553]" style={{ fontSize: 22 }}>check_circle</span>
        <div className="flex flex-col">
          <span className="text-[14px] font-semibold text-[#0B0B0B]">¡Datos del paciente vinculados con éxito!</span>
          <span className="text-[13px] text-[#393939]">Hemos vinculado de manera exitosa los datos del paciente provenientes del sistema &lt;API nombre del sistema&gt;.</span>
        </div>
      </div>

      {/* patient card */}
      <div className="rounded-[12px] border border-[#EBEBEB] bg-white p-4">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="grid h-9 w-9 place-items-center rounded-full bg-[#EEE0F5] text-[13px] font-semibold text-[#82439B]">{initials(p.name)}</div>
            <span className="text-[16px] font-semibold text-[#0B0B0B]">{p.name}</span>
          </div>
          <div className="flex items-center gap-1">
            <button className="grid h-9 w-9 place-items-center rounded-full text-[#626262] hover:bg-[#F7F7F7]" aria-label="Abrir paciente">
              <span className="material-symbols-outlined" style={{ fontSize: 20 }}>open_in_new</span>
            </button>
            <button onClick={onUnlink} className="grid h-9 w-9 place-items-center rounded-full text-[#C9006F] hover:bg-[#FDEFF6]" aria-label="Desvincular paciente">
              <span className="material-symbols-outlined" style={{ fontSize: 20 }}>delete</span>
            </button>
          </div>
        </div>

        <div className="mt-4 grid grid-cols-1 gap-x-8 gap-y-4 sm:grid-cols-2">
          <Field label="Documento/DNI:" value={p.documento} />
          <Field label="Fecha de nacimiento:" value={p.nacimiento} />
          <Field label="Edad:" value={p.edad} />
          <Field label="Género:" value={p.genero} />
          <Field label="Grupo sanguíneo:" value={p.sangre} />
          <Field label="Última consulta:" value={p.ultimaConsulta} />
          <Field label="Teléfono:" value={p.telefono} />
          <Field label="Correo:" value={p.correo} />
        </div>

        <div className="mt-4 flex flex-col gap-3 border-t border-[#EBEBEB] pt-4">
          <div className="flex flex-col gap-0.5">
            <span className="text-[13px] text-[#626262]">NPS:</span>
            <span className="text-[14px] text-[#0B0B0B]">{p.nps}</span>
          </div>
          <Field label="Alergias:" value={p.alergias} />
          <Field label="Contactos de emergencia:" value={`${p.contactoNombre}: ${p.contactoTel}`} />
          <Field label="Dirección:" value={p.direccion} />
        </div>
      </div>
    </div>
  );
}

function FileUpload() {
  const [files, setFiles] = useState([]);
  const [drag, setDrag] = useState(false);
  const inputRef = useRef(null);
  const add = (list) => {
    const ok = [...list].filter(f => /\.(pdf|jpe?g)$/i.test(f.name));
    setFiles(prev => [...prev, ...ok]);
  };
  return (
    <div className="flex flex-col gap-3">
      <span className="text-[13px] text-[#393939]">Documentos adicionales del paciente (Historia, ordenes y/o estudios).</span>
      <div
        onClick={() => inputRef.current?.click()}
        onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={(e) => { e.preventDefault(); setDrag(false); add(e.dataTransfer.files); }}
        className={"flex cursor-pointer flex-col items-center gap-1 rounded-[12px] border border-dashed px-4 py-8 text-center transition-colors " + (drag ? "border-[#82439B] bg-[#FBF3FF]" : "border-[#BEBEBE] bg-[#FCFCFC] hover:bg-[#F7F7F7]")}
      >
        <span className="material-symbols-outlined text-[#82439B]">cloud_upload</span>
        <span className="text-[14px] text-[#0B0B0B]"><span className="font-medium text-[#82439B]">Haga click para subir archivos</span> o arrastre archivos aquí</span>
        <span className="text-[12px] text-[#767676]">Sólo archivos PDF, JPG o JPEG (máximo 10MB)</span>
      </div>
      <input ref={inputRef} type="file" accept=".pdf,.jpg,.jpeg" multiple hidden
        onChange={(e) => { add(e.target.files); e.target.value = ""; }} />
      {files.length > 0 && (
        <div className="flex flex-col gap-2">
          {files.map((f, i) => (
            <div key={i} className="flex items-center gap-3 rounded-[8px] border border-[#EBEBEB] bg-white p-2">
              <span className="material-symbols-outlined text-[#82439B]" style={{ fontSize: 20 }}>{/\.pdf$/i.test(f.name) ? "picture_as_pdf" : "image"}</span>
              <span className="flex-1 truncate text-[13px] text-[#0B0B0B]">{f.name}</span>
              <button onClick={() => setFiles(files.filter((_, j) => j !== i))} className="grid h-7 w-7 place-items-center rounded-full text-[#626262] hover:bg-[#F7F7F7]" aria-label="Quitar">
                <span className="material-symbols-outlined" style={{ fontSize: 18 }}>close</span>
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function FollowupBlock({ fu }) {
  const [freq, setFreq] = useState(fu.freq);
  const [value, setValue] = useState(fu.value);
  return (
    <div className="rounded-[12px] border border-[#EBEBEB] bg-[#FCFCFC] p-4">
      <span className="text-[14px] font-semibold text-[#0B0B0B]">
        Seguimiento #{fu.n}{fu.cierre ? " (seguimiento de cierre)" : ""}
      </span>
      <div className="mt-3 grid grid-cols-[1fr_96px] gap-3">
        <label className="flex flex-col gap-1">
          <span className="text-[12px] text-[#626262]">Frecuencia</span>
          <select value={freq} onChange={(e) => setFreq(e.target.value)}
            className="h-11 rounded-[6px] border border-[#D9D9D9] bg-white px-3 text-[14px] text-[#0B0B0B] focus:border-[#8D53AA] focus:outline-none">
            <option>Horas</option><option>Días</option><option>Semanas</option>
          </select>
        </label>
        <label className="flex flex-col gap-1">
          <span className="text-[12px] text-[#626262]">&nbsp;</span>
          <input value={value} onChange={(e) => setValue(e.target.value.replace(/[^0-9]/g, ""))}
            inputMode="numeric"
            className="h-11 rounded-[6px] border border-[#D9D9D9] bg-white px-3 text-[14px] text-[#0B0B0B] focus:border-[#8D53AA] focus:outline-none" />
        </label>
      </div>
      <span className="mt-4 block text-[13px] font-medium text-[#0B0B0B]">Preguntas</span>
      <div className="mt-2 flex flex-col gap-2">
        {fu.questions.map((q, i) => (
          <div key={i} className="flex items-start gap-2 rounded-[8px] bg-[#F7F7F7] px-3 py-2">
            <span className="material-symbols-outlined text-[#82439B]" style={{ fontSize: 18 }}>help</span>
            <span className="text-[13px] text-[#393939]">{q}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────
   THE MODAL — single component, single `isExpanded` boolean.
   The expandable region uses grid-template-rows 0fr → 1fr so the modal
   grows to the content's NATURAL height with a pure-CSS transition.
   No second modal, no measuring, no jump.
   ──────────────────────────────────────────────────────────────── */
function NuevoSeguimientoModal({ open, onClose }) {
  const [isExpanded, setIsExpanded] = useState(false);
  const [query, setQuery] = useState("");
  const [focused, setFocused] = useState(false);
  const [patient, setPatient] = useState(null);
  const [code, setCode] = useState("+58");
  const inputRef = useRef(null);
  const scrollRef = useRef(null);

  const digits = query.replace(/[^0-9]/g, "");
  const matches = digits ? PATIENTS.filter(p => p.dni.startsWith(digits)) : [];
  const showDropdown = open && focused && digits.length > 0 && !isExpanded;

  const selectPatient = useCallback((p) => {
    setPatient({ ...MOCK_PATIENT, name: p.name, documento: p.dni.length > 6
      ? p.dni.replace(/(\d{3})(?=\d)/g, "$1 ").trim() : p.dni });
    setIsExpanded(true);   // ← the ONLY flag that drives the growth
    setQuery("");          // input cleared/locked
    setFocused(false);
    inputRef.current?.blur();
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  }, []);

  const reset = useCallback(() => {
    setIsExpanded(false);  // ← collapses the same modal
    setPatient(null);
    setQuery("");
    setFocused(true);
    setTimeout(() => inputRef.current?.focus(), 0);
  }, []);

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-6"
      style={{ background: "rgba(11,11,11,0.80)" }}
      onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>

      <div
        ref={scrollRef}
        className="ns-scroll my-auto flex max-h-[90vh] w-full max-w-[560px] flex-col overflow-y-auto rounded-[16px] bg-[#FCFCFC] shadow-[0_8px_24px_rgba(0,0,0,0.10),0_2px_4px_rgba(0,0,0,0.06)]"
        role="dialog" aria-modal="true">

        {/* Header — title + availability counter (always present) */}
        <div className="sticky top-0 z-10 flex flex-col gap-3 border-b border-[#EBEBEB] bg-[#FCFCFC] px-6 pb-4 pt-5">
          <div className="flex items-center justify-between">
            <h2 className="text-[18px] font-semibold text-[#0B0B0B]">Nuevo seguimiento</h2>
            <button onClick={onClose} className="grid h-9 w-9 place-items-center rounded-full text-[#626262] hover:bg-[#F7F7F7]" aria-label="Cerrar">
              <span className="material-symbols-outlined">close</span>
            </button>
          </div>
          <div className="flex items-center gap-4">
            <span className="whitespace-nowrap text-[13px] text-[#393939]">Seguimientos disponibles: 50/100</span>
            <div className="h-2 flex-1 overflow-hidden rounded-full bg-[#FBF3FF]">
              <div className="h-full rounded-full bg-[#82439B]" style={{ width: "50%" }} />
            </div>
          </div>
        </div>

        {/* Body */}
        <div className="flex flex-col gap-4 px-6 py-5">
          {/* Search input + dropdown */}
          <div className="relative flex flex-col gap-1.5">
            <label className="text-[13px] font-semibold text-[#0B0B0B]" htmlFor="ns-dni">Documento/DNI del paciente</label>
            <div className={"flex h-14 items-center gap-2 rounded-full border bg-[#FBF3FF] px-4 transition-colors "
              + (focused ? "border-[#8D53AA]" : "border-transparent")}>
              <input
                id="ns-dni" ref={inputRef}
                value={query}
                disabled={isExpanded}
                inputMode="numeric"
                placeholder="Escriba número de documento/DNI del paciente"
                onChange={(e) => setQuery(e.target.value.replace(/[^0-9]/g, ""))}
                onFocus={() => setFocused(true)}
                onBlur={() => setTimeout(() => setFocused(false), 120)}
                className="min-w-0 flex-1 bg-transparent text-[14px] text-[#393939] placeholder:text-[#767676] focus:outline-none disabled:cursor-default" />
              <button
                onClick={() => (digits ? reset() : inputRef.current?.focus())}
                className="grid h-6 w-6 place-items-center text-[#767676]" aria-label={digits ? "Borrar" : "Buscar"}>
                <span className="material-symbols-outlined">{digits ? "close" : "search"}</span>
              </button>
            </div>

            {showDropdown && (
              <div className="absolute left-0 right-0 top-[100%] z-20 mt-1.5 overflow-hidden rounded-[16px] bg-white py-1 shadow-[0_8px_24px_rgba(0,0,0,0.10),0_2px_4px_rgba(0,0,0,0.06)]">
                {matches.length > 0 ? matches.map((p) => (
                  <button key={p.dni}
                    onMouseDown={(e) => e.preventDefault()}
                    onClick={() => selectPatient(p)}
                    className="flex w-full items-center gap-3 px-4 py-2 text-left hover:bg-[#FBF3FF]">
                    <span className="grid h-8 w-8 place-items-center rounded-full bg-[#FBF3FF] text-[#82439B]">
                      <span className="material-symbols-outlined" style={{ fontSize: 20 }}>person</span>
                    </span>
                    <span className="flex flex-col">
                      <span className="text-[14px] font-medium text-[#0B0B0B]">{p.name}</span>
                      <span className="text-[12px] text-[#626262]"><b className="font-bold text-[#82439B]">{p.dni.slice(0, digits.length)}</b>{p.dni.slice(digits.length)}</span>
                    </span>
                  </button>
                )) : (
                  <div className="px-4 py-3 text-[13px] text-[#626262]">No hemos encontrado resultados para <b className="font-semibold text-[#393939]">{digits}</b></div>
                )}
              </div>
            )}

            {!isExpanded && (
              <p className="px-4 text-[12px] text-[#626262]">Buscamos al paciente en su lista activa a medida que escribe.</p>
            )}
          </div>

          {/* ───── EXPANDABLE REGION — grows to natural height via grid 0fr→1fr ───── */}
          <div
            className="grid transition-[grid-template-rows] duration-300 ease-[cubic-bezier(0.4,0,0.2,1)]"
            style={{ gridTemplateRows: isExpanded ? "1fr" : "0fr" }}>
            <div className="min-h-0 overflow-hidden">
              <div className={"flex flex-col gap-8 pt-2 transition-opacity duration-200 " + (isExpanded ? "opacity-100 delay-100" : "opacity-0")}>
                {patient && <>
                  <PatientCard p={patient} onUnlink={reset} />

                  {/* Contact channels */}
                  <div className="flex flex-col gap-4">
                    <div className="flex flex-col gap-1">
                      <h3 className="text-[15px] font-semibold text-[#0B0B0B]">Canales de seguimiento</h3>
                      <p className="text-[13px] text-[#626262]">Esta información de contacto es obligatoria ya que a través de estos canales el paciente recibirá el seguimiento pautado.</p>
                    </div>
                    <label className="flex flex-col gap-1">
                      <span className="text-[12px] text-[#626262]">Correo <span className="text-[#C9006F]">*</span></span>
                      <input type="email" defaultValue={patient.correo}
                        className="h-11 rounded-[6px] border border-[#D9D9D9] bg-white px-3 text-[14px] text-[#0B0B0B] focus:border-[#8D53AA] focus:outline-none" />
                    </label>
                    <div className="grid grid-cols-[150px_1fr] gap-3">
                      <label className="flex flex-col gap-1">
                        <span className="text-[12px] text-[#626262]">Código</span>
                        <select value={code} onChange={(e) => setCode(e.target.value)}
                          className="h-11 rounded-[6px] border border-[#D9D9D9] bg-white px-3 text-[14px] text-[#0B0B0B] focus:border-[#8D53AA] focus:outline-none">
                          <option value="+58">Venezuela (+58)</option>
                          <option value="+57">Colombia (+57)</option>
                          <option value="+52">México (+52)</option>
                          <option value="+51">Perú (+51)</option>
                        </select>
                      </label>
                      <label className="flex flex-col gap-1">
                        <span className="text-[12px] text-[#626262]">Teléfono <span className="text-[#C9006F]">*</span></span>
                        <input type="tel" inputMode="numeric" defaultValue="414 123 45 89"
                          className="h-11 rounded-[6px] border border-[#D9D9D9] bg-white px-3 text-[14px] text-[#0B0B0B] focus:border-[#8D53AA] focus:outline-none" />
                      </label>
                    </div>
                    <FileUpload />
                  </div>

                  {/* Seguimientos */}
                  <div className="flex flex-col gap-4">
                    <div className="flex flex-col gap-1">
                      <h3 className="text-[15px] font-semibold text-[#0B0B0B]">Seguimientos del paciente</h3>
                      <p className="text-[13px] text-[#626262]">Defina el horario de cada mensaje de seguimiento que recibirá el paciente.</p>
                    </div>
                    {FOLLOWUPS.map((fu) => <FollowupBlock key={fu.n} fu={fu} />)}
                  </div>
                </>}
              </div>
            </div>
          </div>
        </div>

        {/* Footer (sticky) */}
        <div className="sticky bottom-0 z-10 flex items-center justify-between gap-3 border-t border-[#EBEBEB] bg-[#FCFCFC] px-6 py-4">
          <button className="flex items-center gap-1.5 text-[14px] font-medium text-[#82439B] hover:underline">
            <span className="material-symbols-outlined" style={{ fontSize: 18 }}>flag</span>Reportar problema
          </button>
          <div className="flex items-center gap-2">
            <button onClick={onClose} className="h-11 rounded-full border border-[#D9D9D9] bg-white px-5 text-[14px] font-medium text-[#0B0B0B] hover:bg-[#F7F7F7]">Cancelar</button>
            <button
              disabled={!isExpanded}
              onClick={() => { alert("Seguimiento creado para " + patient.name); onClose(); }}
              className={"h-11 rounded-full px-5 text-[14px] font-medium transition-colors "
                + (isExpanded ? "bg-[#82439B] text-white hover:bg-[#552D78]" : "cursor-not-allowed bg-[#F7F7F7] text-[#767676]")}>
              Crear seguimiento
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* Demo launcher */
function App() {
  const [open, setOpen] = useState(true);
  return (
    <div className="grid min-h-screen place-items-center p-10">
      <button onClick={() => setOpen(true)}
        className="h-11 rounded-full bg-[#82439B] px-5 text-[14px] font-medium text-white hover:bg-[#552D78]">
        Crear seguimiento
      </button>
      <NuevoSeguimientoModal open={open} onClose={() => setOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
